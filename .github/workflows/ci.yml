name: CI & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  VERSION: 0.0.1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: superc-linux-amd64
          - os: macos-latest
            artifact: superc-macos-amd64
          - os: windows-latest
            artifact: superc-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup build environment (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make gcc clang

      - name: Setup build environment (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install make gcc

      - name: Setup build environment (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install make -y
          echo "C:/ProgramData/chocolatey/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        run: make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
        shell: bash

      - name: Run tests
        run: make test
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/superc*
          retention-days: 7

  test-arm64:
    name: Test ARM64 (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu make

      - name: Build for ARM64
        env:
          CC: aarch64-linux-gnu-gcc
          CFLAGS: -static
        run: |
          make clean
          make -j$(nproc) CC=aarch64-linux-gnu-gcc CFLAGS="-static"

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: superc-linux-arm64
          path: |
            build/bin/superc*
          retention-days: 7

  release:
    name: Create Release
    needs: [test, test-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Copy install scripts from repo
        run: |
          cp install.sh release/
          cp install.ps1 release/
          chmod +x release/install.sh

      - name: Prepare release files
        run: |
          mkdir -p release
          # Linux AMD64
          cp dist/superc-linux-amd64/superc release/superc-linux-amd64
          # Linux ARM64 (cross-compiled)
          cp dist/superc-linux-arm64/superc release/superc-linux-arm64
          # macOS AMD64
          cp dist/superc-macos-amd64/superc release/superc-macos-amd64
          # Windows AMD64
          cp dist/superc-windows-amd64.exe/superc.exe release/superc-windows-amd64.exe

      - name: Create packages
        run: |
          cd release
          VERSION=${GITHUB_REF_NAME#v}
          
          # Create tarballs
          tar czf superc-linux-amd64.tar.gz superc-linux-amd64
          tar czf superc-linux-arm64.tar.gz superc-linux-arm64
          tar czf superc-macos-amd64.tar.gz superc-macos-amd64
          
          # Create zip for Windows
          zip superc-windows-amd64.zip superc-windows-amd64.exe
          
          # Create checksums
          sha256sum *.tar.gz *.zip > checksums.txt
          
          # Create deb package (Linux AMD64)
          mkdir -p deb/usr/local/bin
          cp superc-linux-amd64 deb/usr/local/bin/superc
          cat > deb/DEBIAN/control << DEBEOF
          Package: superc
          Version: $VERSION
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: Super-Lang Authors
          Description: Super Language Compiler
          DEBEOF
          dpkg-deb --build deb superc_${VERSION}_amd64.deb 2>/dev/null || true
          
          # Create rpm package (Linux AMD64)
          mkdir -p rpm/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p rpm/usr/local/bin
          cp superc-linux-amd64 rpm/usr/local/bin/superc
          cat > rpm/SPECS/superc.spec << RPMEOF
          Name: superc
          Version: $VERSION
          Release: 1
          Summary: Super Language Compiler
          License: MIT
          Group: Development/Tools
          BuildArch: x86_64
          %description
          Super Language Compiler
          %files
          /usr/local/bin/superc
          RPMEOF
          rpmbuild --define "_topdir $(pwd)/rpm" -bb rpm/SPECS/superc.spec 2>/dev/null || true
          cp rpm/RPMS/x86_64/superc-${VERSION}-1.x86_64.rpm . 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Super-Lang ${{ github.ref_name }}
          body: |
            ## Super-Lang ${{ github.ref_name }}
            
            ### 安装
            
            **Linux/macOS (交互式安装):**
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh | bash -s ${{ github.ref_name }}
            ```
            
            **Windows PowerShell (交互式安装):**
            ```powershell
            iwr https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.ps1 | iex
            ```
            
            ### 直接下载
            
            | 平台 | 二进制 | 压缩包 |
            |------|--------|--------|
            | Linux x86_64 | `superc-linux-amd64` | `superc-linux-amd64.tar.gz` |
            | Linux ARM64 | `superc-linux-arm64` | `superc-linux-arm64.tar.gz` |
            | macOS x86_64 | `superc-macos-amd64` | `superc-macos-amd64.tar.gz` |
            | Windows x86_64 | `superc-windows-amd64.exe` | `superc-windows-amd64.zip` |
            
            ### 系统安装包
            - `superc_${VERSION}_amd64.deb` (Debian/Ubuntu)
            - `superc-${VERSION}-1.x86_64.rpm` (RHEL/Fedora)
            
            ### 校验
            ```
            sha256sum -c checksums.txt
            ```
            
            ### 安装脚本功能
            - 交互式中英文选择
            - 代理配置 (HTTP/HTTPS/SOCKS5)
            - 安装模式选择 (二进制/源码构建/自动)
            - 自定义安装目录
            - 自动更新 PATH
            
            ### 快速开始
            ```bash
            super init myproj
            cd myproj
            super run main.super
            super build main.super
            ```
          draft: false
          prerelease: false
          files: |
            release/superc-*
            release/install.sh
            release/install.ps1
            release/checksums.txt
            release/*.deb
            release/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to Package Registries
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 可扩展：发布到 Homebrew, Scoop, Chocolatey, AUR 等
      - name: Update Homebrew formula
        run: |
          echo "Homebrew formula update would go here"
        # 示例：使用 homebrew-action 更新 tap 仓库